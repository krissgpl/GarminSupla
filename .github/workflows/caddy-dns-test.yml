name: Test Caddy DNS image

on:
  workflow_dispatch:
    inputs:
      provider:
        description: DNS provider module
        required: true
        type: choice
        options:
          - ovh
          - cloudflare

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select DNS module
        id: dns
        shell: bash
        run: |
          case "${{ inputs.provider }}" in
            ovh)
              echo "module=github.com/caddy-dns/ovh" >> "$GITHUB_OUTPUT"
              ;;
            cloudflare)
              echo "module=github.com/caddy-dns/cloudflare" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Caddy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/caddy/Dockerfile.dns
          load: true
          push: false
          tags: garminsupla-caddy-dns:test
          build-args: |
            DNS_PLUGIN=${{ steps.dns.outputs.module }}

      - name: Verify installed DNS module
        shell: bash
        run: |
          docker run --rm \
            --entrypoint caddy \
            garminsupla-caddy-dns:test \
            list-modules \
            | grep -Fx "dns.providers.${{ inputs.provider }}"

      - name: Verify Caddy version
        run: |
          docker run --rm \
            --entrypoint caddy \
            garminsupla-caddy-dns:test \
            version
