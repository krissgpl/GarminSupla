name: Publish Caddy DNS image

on:
  workflow_dispatch:
    inputs:
      provider:
        description: DNS provider module
        required: true
        type: choice
        options:
          - ovh
          - cloudflare

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select DNS module
        id: dns
        shell: bash
        run: |
          case "${{ inputs.provider }}" in
            ovh)
              echo "module=github.com/caddy-dns/ovh" >> "$GITHUB_OUTPUT"
              ;;
            cloudflare)
              echo "module=github.com/caddy-dns/cloudflare" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/caddy/Dockerfile.dns
          load: true
          push: false
          tags: garminsupla-caddy-dns:test
          build-args: |
            DNS_PLUGIN=${{ steps.dns.outputs.module }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify DNS module
        shell: bash
        run: |
          docker run --rm \
            --entrypoint caddy \
            garminsupla-caddy-dns:test \
            list-modules \
            | grep -Fx "dns.providers.${{ inputs.provider }}"

      - name: Verify Caddy
        run: |
          docker run --rm \
            --entrypoint caddy \
            garminsupla-caddy-dns:test \
            version

      - name: Login to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/garminsupla-caddy-dns"
          provider="${{ inputs.provider }}"
          version="${provider}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker tag garminsupla-caddy-dns:test "$image:$version"
          docker push "$image:$version"

          docker tag garminsupla-caddy-dns:test "$image:$provider"
          docker push "$image:$provider"

          echo "Published $image:$version" >> "$GITHUB_STEP_SUMMARY"
          echo "Published $image:$provider" >> "$GITHUB_STEP_SUMMARY"
