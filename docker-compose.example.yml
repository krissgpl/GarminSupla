services:

  garminsupla-api:
    build: .
    user: "${GARMIN_SUPLA_RUN_UID:-1000}:${GARMIN_SUPLA_RUN_GID:-1000}"
    container_name: garminsupla-api
    restart: unless-stopped

    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    ports:
      - "${GARMIN_SUPLA_ADMIN_BIND_IP:-127.0.0.1}:${GARMIN_SUPLA_ADMIN_PORT:-8009}:8008"

    env_file:
      - .env

    volumes:
      - .:/app:ro
      - ./data:/app/data:rw

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8008), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  garminsupla-watch:
    build: .
    user: "${GARMIN_SUPLA_RUN_UID:-1000}:${GARMIN_SUPLA_RUN_GID:-1000}"
    restart: unless-stopped

    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    command:
      - uvicorn
      - app.watch_app:watch_app
      - --host
      - 0.0.0.0
      - --port
      - "8008"

    env_file:
      - .env

    volumes:
      - .:/app:ro
      - ./data:/app/data:rw

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8008), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  garminsupla-watch-proxy:
    image: ghcr.io/krissgpl/garminsupla-caddy-dns@sha256:7192684f73e455edc1567a2bd679013428f79d29cb8db5ff2ea0bbd8bf1a0fc9
    restart: unless-stopped

    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    read_only: true

    security_opt:
      - no-new-privileges:true

    depends_on:
      garminsupla-watch:
        condition: service_healthy

    ports:
      - "${GARMIN_SUPLA_WATCH_BIND_IP:-127.0.0.1}:8008:8008/tcp"

    environment:
      GARMIN_SUPLA_WATCH_DOMAIN: "${GARMIN_SUPLA_WATCH_DOMAIN:?Set GARMIN_SUPLA_WATCH_DOMAIN}"

    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - "${GARMIN_SUPLA_CERT_DIR:?Set GARMIN_SUPLA_CERT_DIR}:/run/garminsupla-watch-certs:ro"
      - garminsupla_caddy_data:/data
      - garminsupla_caddy_config:/config

volumes:
  garminsupla_caddy_data:
  garminsupla_caddy_config:
