{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">

        {% include "components/wizard_progress.html" %}

        <div class="card shadow-sm rounded-4 border-0 mt-4">
            <div class="card-body p-4">

                <h2>Select Gate</h2>

                <p class="text-muted">
                    Choose the gate that will be controlled by your Garmin watch.
                </p>

                <div id="gate-content">

                    <div class="text-center py-5">

                        <div
                            class="spinner-border"
                            role="status"
                        >
                            <span class="visually-hidden">
                                Loading...
                            </span>
                        </div>

                        <p class="mt-3 text-muted">
                            Loading available gates...
                        </p>

                    </div>

                </div>

                <div class="mt-4 d-flex justify-content-end">
                    <button
                        id="continue-btn"
                        type="button"
                        class="btn btn-primary"
                        disabled
                    >
                        Continue
                    </button>
                </div>

            </div>
        </div>

    </div>
</div>

<script type="module" src="/static/js/select_gate.js"></script>

{% endblock %}
