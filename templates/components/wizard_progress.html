<div class="mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0 text-muted">
            Setup Wizard
        </h6>

        <small class="text-muted">
            Step {{ step }} of {{ steps }}
        </small>
    </div>

    {% set progress = (step * 100 / steps) | round | int %}

    <div
        class="progress"
        role="progressbar"
        aria-label="Setup progress"
        aria-valuenow="{{ progress }}"
        aria-valuemin="0"
        aria-valuemax="100"
        style="height: 10px;"
    >
        <div
            class="progress-bar"
            style="width: {{ progress }}%;"
        ></div>
    </div>
</div>
