{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-12 col-md-8 col-lg-7 col-xl-5">

        <div class="card shadow-sm rounded-4 border-0">
            <div class="card-body p-4 p-lg-5">
            
                <div class="mb-5">
                    {% include "components/wizard_progress.html" %}
                </div>
                
                <h2 class="h3 mb-2">
                    GarminSupla Setup
                </h2>

                <p class="text-muted mb-3">
                    Enter the address of your SUPLA server:
                </p>

                <form method="post" novalidate>

                    <div class="mb-4">
                        <label
                            for="server"
                            class="form-label fw-semibold"
                        >
                            SUPLA Server
                        </label>

                        <input
                            type="url"
                            class="form-control form-control-lg {% if errors and errors.server %}is-invalid{% endif %}"
                            id="server"
                            name="server"
                            placeholder="https://supla.example.com"
                            value="{{ form.server if form else '' }}"
                            required
                            autofocus
                        >

                        {% if errors and errors.server %}
                        <div class="invalid-feedback">
                            {{ errors.server }}
                        </div>
                        {% endif %}

                        <div class="form-text">
                            Enter the URL of your SUPLA server.
                        </div>
                    </div>
                    <div class="d-grid mt-3">
                        <button
                            type="submit"
                            class="btn btn-success btn-lg"
                        >
                            Continue
                            <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
