{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm rounded-4" style="max-width: 600px; width: 100%;">

    <div class="card-body p-5">

        <h2 class="card-title mb-4">
            Welcome
        </h2>

        <p class="text-muted mb-4">
            Configure the connection between your Garmin watch
            and your SUPLA server.
        </p>

        <h5 class="mb-3">
            The setup wizard will guide you through:
        </h5>

        <ul class="list-group list-group-flush mb-4">

            <li class="list-group-item">
                <i class="bi bi-shield-check text-success me-2"></i>
                SUPLA authorization
            </li>

            <li class="list-group-item">
                <i class="bi bi-car-front text-success me-2"></i>
                Gate selection
            </li>

            <li class="list-group-item">
                <i class="bi bi-key text-success me-2"></i>
                API key generation
            </li>

        </ul>

        <div class="d-grid">

            <button class="btn btn-success btn-lg">

                <i class="bi bi-play-circle me-2"></i>

                Start setup

            </button>

        </div>

    </div>

</div>

{% endblock %}
