{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center w-100">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <div class="card shadow-sm rounded-4 border-0">
            <div class="card-body p-4 p-lg-5">

                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock fs-1 app-title"></i>

                    <h2 class="mt-3 mb-1">
                        Administrator Login
                    </h2>

                    <p class="text-muted mb-0">
                        Sign in to manage GarminSupla.
                    </p>
                </div>

                {% if error %}

                <div
                    class="alert alert-danger"
                    role="alert"
                >
                    {{ error }}
                </div>

                {% endif %}

                <form
                    method="post"
                    action="/login"
                >

                    <div class="mb-3">
                        <label
                            for="username"
                            class="form-label"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control form-control-lg"
                            id="username"
                            name="username"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-4">
                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control form-control-lg"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg w-100"
                    >
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
